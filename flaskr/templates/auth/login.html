{% extends 'base.html'%}

{% block title %}
Log In
{% endblock title %}


{% block header %}
<h1>
  Log In
</h1>
{% endblock header %}

{% block content %}
<form method="POST">
  <div>
    <label for="username">Username</label>
    <input type="text" name="username" id="username">
  </div>
  <div>
    <label for="password">Password</label>
    <input type="password" name="password" id="password">
  </div>
  <div>
    <input type="submit" value="Login"">
</div>
</form>
{% endblock content %}
